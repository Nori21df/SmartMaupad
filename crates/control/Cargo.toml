[package]
name = "smartmaupad-control"
version.workspace = true
edition.workspace = true

[[bin]]
name = "smartmaupad-control"
path = "src/main.rs"

[dependencies]
smartmaupad-shared.workspace = true
smartmaupad-ui.workspace = true
eframe.workspace = true
serde.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
] }
