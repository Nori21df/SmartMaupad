[workspace]
resolver = "2"
members = ["crates/shared", "crates/target", "crates/control"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
smartmaupad-shared = { path = "crates/shared" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
windows-sys = "0.59"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
if-addrs = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
